dataset:
  name: wiki13m
  # Instead of a single num_queries, we sweep over these batch sizes:
#  query_batch_sizes: [1, 8, 16, 32, 64, 128, 256, 512]
  num_queries: 4096
  query_batch_sizes: [1, 4, 16, 64, 256, 1024, 4096]
  k: 100

trials: 3
warmup: 1
overwrite: true
force_rebuild: false

indexes:
  - name: Quake_Unbatched
    index: Quake
    build_params:
      nc: 3500
      metric: ip
      num_workers: 0
      use_numa: true
      omp_num_threads_build: 8
      parent:
        num_workers: 0
    search_params:
      nprobe: 4
      batch_size: 128
      parent:
        batched_scan: true
        batch_size: 128
      batched_scan: false

  - name: Quake_Batched
    index: Quake
    build_params:
      nc: 3500
      metric: ip
      num_workers: 0
      omp_num_threads_build: 8
      use_numa: true
      parent:
        num_workers: 0
    search_params:
      nprobe: 4
      batch_size: 128
      parent:
        batched_scan: true
        batch_size: 128
      batched_scan: true

  - name: FaissIVF
    index: IVF
    build_params:
      nc: 3500
      metric: ip
      omp_num_threads_build: 1
    search_params:
      nprobe: 4
      omp_num_threads_search: 1

output:
  results_csv: numa_query_batch_results.csv