  - name: Quake_Serial
    index: Quake
    build_params:
      nc: 1000
      metric: ip
      num_workers: 1
      use_numa: true
      parent:
        num_workers: 1
    search_params:
      k: 100
      recall_target: .9
      initial_search_fraction: .05
      batched_scan: false
      parent:
        batched_scan: true
        batch_size: 128
    maintenance_params:
      refinement_radius: 50
      split_threshold_ns: 250
      delete_threshold_ns: 500000
      enable_split_rejection: true
      enable_delete_rejection: false
      window_size: 10000

